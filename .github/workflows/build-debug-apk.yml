name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repo does not include gradlew/gradlew.bat/gradle-wrapper.jar
      # (normal for Google AI Studio exports). This step regenerates them
      # to match the version pinned in gradle/wrapper/gradle-wrapper.properties.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            GRADLE_VERSION=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
            echo "Using Gradle version: $GRADLE_VERSION"
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi
          chmod +x ./gradlew

      # Writes .env from repository secrets, so app/build.gradle.kts can read
      # GOOGLE_WEB_CLIENT_ID and NOTIFICATION_WORKER_URL into BuildConfig.
      # Neither value is a backend secret — the OAuth Web Client ID and the
      # Worker URL are both meant to be public/embedded in the app — but they
      # still live in GitHub secrets so you don't have to edit code to change
      # them, and so local .env (git-ignored) stays the source of truth when
      # building outside CI.
      - name: Write .env from repository secrets
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          NOTIFICATION_WORKER_URL: ${{ secrets.NOTIFICATION_WORKER_URL }}
        run: |
          echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}" > .env
          echo "NOTIFICATION_WORKER_URL=${NOTIFICATION_WORKER_URL}" >> .env

      # If the repository secret GOOGLE_SERVICES_JSON is configured, write it.
      # This secret should contain the RAW JSON content of google-services.json
      # (not base64-encoded) — paste the file's contents directly as the
      # secret value in GitHub Settings > Secrets and variables > Actions.
      # Otherwise fall back gracefully (missingGoogleServicesStrategy = WARN).
      - name: Write google-services.json (if secret is configured)
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Writing app/google-services.json from secret..."
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "::warning::app/google-services.json not found — Firebase/Google Sign-In will not work in this build, but the build itself will still succeed."
          fi

      # debug.keystore is expected at the repo root by app/build.gradle.kts
      # (signingConfigs.debugConfig) but is never committed to git. Generate
      # a throwaway one here with the standard Android debug keystore
      # credentials (alias androiddebugkey, password android) so
      # validateSigningDebug has something to sign with.
      - name: Generate debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Prints the SHA-1 and SHA-256 fingerprints of the debug keystore into
      # the Actions log, so they can be copied from here into Firebase
      # Console > Project Settings > Your app > Add fingerprint — no local
      # machine or keytool install needed.
      - name: Print debug keystore fingerprints
        run: |
          echo "=== Copy the SHA-1 and SHA-256 below into Firebase Console ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK found at: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

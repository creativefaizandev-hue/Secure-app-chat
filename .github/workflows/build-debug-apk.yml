name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repo does not include gradlew/gradlew.bat/gradle-wrapper.jar
      # (normal for Google AI Studio exports). This step regenerates them
      # to match the version pinned in gradle/wrapper/gradle-wrapper.properties.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            GRADLE_VERSION=$(grep -oP 'gradle-\K[0-9.]+(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
            echo "Using Gradle version: $GRADLE_VERSION"
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi
          chmod +x ./gradlew

      # If the repository secret GOOGLE_SERVICES_JSON is configured, use it.
      # Works whether you paste the raw JSON or a base64-encoded version.
      # Otherwise fall back gracefully (missingGoogleServicesStrategy = WARN).
      - name: Write google-services.json (if secret is configured)
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Writing app/google-services.json from secret..."
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '"project_info"'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          elif [ ! -f "app/google-services.json" ]; then
            echo "::warning::app/google-services.json not found — Firebase/Google Sign-In will not work in this build, but the build itself will still succeed."
          fi

      # debug.keystore is intentionally gitignored (throwaway debug signing key).
      # Generate it if it's not already present so validateSigningDebug has
      # something to sign with.
      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found, generating..."
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK found at: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
